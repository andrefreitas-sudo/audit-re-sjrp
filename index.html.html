<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0d0d0d;
    --surface: #181818;
    --surface-2: #232323;
    --surface-3: #2c2c2c;
    --border: #2e2e2e;
    --border-strong: #3d3d3d;
    --text: #f0f0f0;
    --text-muted: #9a9a9a;
    --text-dim: #6e6e6e;
    --gold: #c9a961;
    --gold-bright: #e6c47a;
    --gold-dark: #8b7339;
    --success: #4ea860;
    --warning: #ff9800;
    --na: #6b7d8a;
    --danger: #e05656;
  }

  html, body { background: var(--bg); color: var(--text); }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding-bottom: 90px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: linear-gradient(180deg, #000 0%, #0a0a0a 100%);
    border-bottom: 1px solid var(--gold-dark);
    padding: 12px 16px 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-mark {
    width: 38px;
    height: 38px;
    background: var(--gold);
    color: #000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 0.5px;
    flex-shrink: 0;
    box-shadow: 0 0 12px rgba(201,169,97,0.25);
  }

  .brand-info { flex: 1; min-width: 0; }
  .brand-title {
    font-size: 13px;
    font-weight: 800;
    color: var(--gold);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .brand-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .progress { text-align: right; min-width: 70px; }
  .progress-text {
    font-size: 14px;
    font-weight: 800;
    color: var(--gold);
    line-height: 1;
  }
  .progress-text small { font-size: 11px; color: var(--text-muted); font-weight: 600; }
  .progress-bar {
    height: 3px;
    background: var(--surface-3);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold-bright));
    width: 0%;
    transition: width 0.4s ease;
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 64px;
    z-index: 49;
  }
  .tab {
    flex: 1;
    padding: 14px 10px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    font-family: inherit;
  }
  .tab.active { color: var(--gold); }
  .tab.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 30%;
    right: 30%;
    height: 2px;
    background: var(--gold);
  }
  .tab .tab-count {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 7px;
    background: var(--surface-3);
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: var(--text-muted);
  }
  .tab.active .tab-count { background: rgba(201,169,97,0.18); color: var(--gold); }

  /* ---------- Filter chips ---------- */
  .filters {
    display: flex;
    gap: 6px;
    padding: 10px 12px;
    overflow-x: auto;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    -webkit-overflow-scrolling: touch;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }
  .chip.active {
    background: var(--gold);
    color: #000;
    border-color: var(--gold);
    font-weight: 700;
  }

  /* ---------- Sections ---------- */
  .section { border-bottom: 1px solid var(--border); }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: var(--surface);
    cursor: pointer;
    user-select: none;
  }
  .section-title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--gold);
  }
  .section-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
  }
  .section-chevron {
    width: 18px;
    height: 18px;
    transition: transform 0.2s;
    color: var(--text-muted);
  }
  .section.collapsed .section-chevron { transform: rotate(-90deg); }
  .section.collapsed .section-body { display: none; }
  .section-body { padding: 10px 12px 14px; }

  /* ---------- Item cards ---------- */
  .item-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color 0.2s, opacity 0.2s;
  }
  .item-card.done { border-color: var(--success); }
  .item-card.na { border-color: var(--na); opacity: 0.75; }
  .item-card.hidden-by-filter { display: none; }

  .item-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 12px 8px;
  }
  .item-code {
    background: var(--gold);
    color: #000;
    font-weight: 800;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 5px;
    flex-shrink: 0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.5px;
    line-height: 1.2;
    min-width: 44px;
    text-align: center;
  }
  .item-card.done .item-code { background: var(--success); color: #fff; }
  .item-card.na .item-code { background: var(--na); color: #fff; }

  .item-info { flex: 1; min-width: 0; }
  .item-title {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--text);
  }
  .item-spec {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
    line-height: 1.4;
  }
  .item-slide-ref {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .item-instruction {
    font-size: 12px;
    color: #d8c896;
    margin: 4px 12px 10px;
    padding: 8px 10px;
    background: rgba(201,169,97,0.07);
    border-left: 2px solid var(--gold);
    border-radius: 4px;
    line-height: 1.45;
  }
  .item-instruction::before {
    content: '📷  ';
    font-size: 11px;
  }

  .photo-area { margin: 0 12px 10px; }
  .photo-empty {
    border: 2px dashed var(--border-strong);
    border-radius: 8px;
    aspect-ratio: 4/3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 13px;
    gap: 6px;
    background: var(--surface-2);
  }
  .photo-empty svg { width: 32px; height: 32px; opacity: 0.4; }
  .photo-preview-wrap {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
  }
  .photo-preview {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    display: block;
  }
  .photo-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.7);
    color: var(--gold);
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: 0.5px;
    backdrop-filter: blur(4px);
  }

  .photo-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .btn {
    padding: 10px 12px;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex: 1;
    font-family: inherit;
    transition: filter 0.15s, transform 0.05s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--gold);
    color: #000;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-secondary {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border-strong);
  }
  .btn-na {
    background: transparent;
    color: var(--na);
    border: 1px solid var(--na);
    flex: 0 0 80px;
  }
  .btn-na.active { background: var(--na); color: #fff; }
  .btn-icon { flex: 0 0 44px; padding: 10px; }

  .note-input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    font-size: 13px;
    border-radius: 6px;
    margin: 0 0 8px;
    resize: vertical;
    min-height: 36px;
    max-height: 120px;
    font-family: inherit;
    line-height: 1.4;
  }
  .note-input:focus { outline: none; border-color: var(--gold); }
  .note-wrap { padding: 0 12px 10px; }
  .note-label {
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  /* ---------- Bottom bar ---------- */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(180deg, #0a0a0a 0%, #000 100%);
    border-top: 1px solid var(--gold-dark);
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
    z-index: 60;
  }
  .bottom-bar #download-btn { flex: 1; }
  .bottom-bar #menu-btn {
    flex: 0 0 48px;
    background: var(--surface-2);
    color: var(--gold);
    border: 1px solid var(--border-strong);
    font-size: 20px;
    line-height: 1;
  }

  /* ---------- Modal ---------- */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(4px);
  }
  .modal.hidden { display: none; }
  .modal-content {
    background: var(--surface);
    border: 1px solid var(--gold-dark);
    border-radius: 12px;
    padding: 22px 20px;
    width: 100%;
    max-width: 400px;
  }
  .modal-content h3 {
    color: var(--gold);
    margin-bottom: 4px;
    letter-spacing: 1.2px;
    font-size: 15px;
    text-transform: uppercase;
  }
  .modal-content p.modal-sub {
    color: var(--text-muted);
    font-size: 12px;
    margin-bottom: 16px;
    line-height: 1.45;
  }
  .modal-content .menu-item {
    width: 100%;
    margin-bottom: 8px;
    padding: 13px 14px;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    color: var(--text);
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .modal-content .menu-item.danger { color: var(--danger); border-color: rgba(224,86,86,0.3); }
  .modal-item-ico { font-size: 16px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 12px; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 11px 18px;
    border-radius: 24px;
    font-size: 13px;
    z-index: 300;
    font-weight: 600;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    transition: opacity 0.3s, transform 0.3s;
    max-width: 90vw;
    text-align: center;
  }
  .toast.hidden {
    opacity: 0;
    transform: translateX(-50%) translateY(20px);
    pointer-events: none;
  }
  .toast.toast-success { border-color: var(--success); color: var(--success); }
  .toast.toast-error { border-color: var(--danger); color: var(--danger); }

  /* ---------- Area summary ---------- */
  .area-summary {
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .area-summary strong { color: var(--gold); font-weight: 700; }

  /* ---------- Loading state ---------- */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 400;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  .loading-overlay.hidden { display: none; }
  .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid var(--surface-3);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  .loading-text {
    color: var(--gold);
    font-size: 13px;
    letter-spacing: 0.8px;
    font-weight: 700;
    text-align: center;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand-mark">RE</div>
  <div class="brand-info">
    <div class="brand-title">Audit Sheet</div>
    <div class="brand-sub">São José do Rio Preto · Dealer 5200100752</div>
  </div>
  <div class="progress">
    <div class="progress-text"><span id="done-count">0</span><small>/<span id="total-count">0</span></small></div>
    <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-area="showroom">Showroom <span class="tab-count" id="count-showroom">0/0</span></button>
  <button class="tab" data-area="oficina">Oficina <span class="tab-count" id="count-oficina">0/0</span></button>
</nav>

<div class="filters">
  <button class="chip active" data-filter="all">Todos</button>
  <button class="chip" data-filter="pending">⏳ Pendente</button>
  <button class="chip" data-filter="done">✓ Feita</button>
  <button class="chip" data-filter="na">N/A</button>
</div>

<main id="content"></main>

<footer class="bottom-bar">
  <button id="download-btn" class="btn btn-primary">
    <span>📦</span> Baixar fotos (.zip)
  </button>
  <button id="menu-btn" class="btn">⋯</button>
</footer>

<div id="menu-modal" class="modal hidden">
  <div class="modal-content">
    <h3>Opções</h3>
    <p class="modal-sub">Backup, restauração e limpeza de dados.</p>
    <button class="menu-item" id="export-json-btn"><span class="modal-item-ico">💾</span> Exportar backup (.json)</button>
    <button class="menu-item" id="import-json-btn"><span class="modal-item-ico">📥</span> Importar backup (.json)</button>
    <input type="file" id="import-json-input" accept="application/json" hidden>
    <button class="menu-item" id="export-checklist-btn"><span class="modal-item-ico">📋</span> Exportar checklist (.csv)</button>
    <button class="menu-item danger" id="clear-btn"><span class="modal-item-ico">🗑️</span> Apagar todas as fotos e notas</button>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="close-menu-btn" style="flex:1">Fechar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<div id="loading-overlay" class="loading-overlay hidden">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">Processando...</div>
</div>

<script>

// =====================================================================
// IndexedDB layer
// =====================================================================
const DB_NAME = 'audit_re_sjrp';
const DB_VERSION = 1;
const STORE = 'items';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        db.createObjectStore(STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function dbPut(record) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(record);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}

async function dbGet(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = e => reject(e.target.error);
  });
}

async function dbGetAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = e => reject(e.target.error);
  });
}

async function dbDelete(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}

async function dbClear() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}

// =====================================================================
// In-memory state cache (lazy-loaded from IndexedDB)
// =====================================================================
const state = {};  // id -> { id, blob, thumb, note, na, capturedAt }

function makeId(areaKey, code) {
  return `${areaKey}__${code}`.replace(/[^a-zA-Z0-9_.\-]/g, '_');
}

function allItems() {
  const out = [];
  for (const area of AUDIT_DATA.areas) {
    for (const sec of area.sections) {
      for (const item of sec.items) {
        out.push({ areaKey: area.key, areaLabel: area.label, section: sec.name, ...item, id: makeId(area.key, item.code) });
      }
    }
  }
  return out;
}

async function loadState() {
  const all = await dbGetAll();
  for (const rec of all) state[rec.id] = rec;
}

// =====================================================================
// Image compression
// =====================================================================
function compressImage(file, maxW = 1920, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => {
        URL.revokeObjectURL(img.src);
        if (blob) resolve(blob); else reject(new Error('toBlob falhou'));
      }, 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); reject(new Error('Falha ao carregar imagem')); };
    img.src = URL.createObjectURL(file);
  });
}

function makeThumb(file, size = 320) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(size / img.width, size / img.height, 1);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      URL.revokeObjectURL(img.src);
      resolve(dataUrl);
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); resolve(null); };
    img.src = URL.createObjectURL(file);
  });
}

// =====================================================================
// Minimal in-browser ZIP writer (store method, no compression)
// =====================================================================
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function dosTime(d) {
  return ((d.getHours() & 0x1F) << 11) | ((d.getMinutes() & 0x3F) << 5) | ((d.getSeconds() >>> 1) & 0x1F);
}
function dosDate(d) {
  return (((d.getFullYear() - 1980) & 0x7F) << 9) | (((d.getMonth() + 1) & 0xF) << 5) | (d.getDate() & 0x1F);
}

async function buildZip(files) {
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  const now = new Date();
  const time = dosTime(now);
  const date = dosDate(now);

  for (const f of files) {
    const data = f.data instanceof Blob ? new Uint8Array(await f.data.arrayBuffer()) : f.data;
    const nameBuf = enc.encode(f.name);
    const crc = crc32(data);
    const size = data.length;

    const lfh = new ArrayBuffer(30);
    const dv = new DataView(lfh);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, time, true);
    dv.setUint16(12, date, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, size, true);
    dv.setUint32(22, size, true);
    dv.setUint16(26, nameBuf.length, true);
    dv.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lfh), nameBuf, data);

    const cd = new ArrayBuffer(46);
    const dvc = new DataView(cd);
    dvc.setUint32(0, 0x02014b50, true);
    dvc.setUint16(4, 0x031E, true);
    dvc.setUint16(6, 20, true);
    dvc.setUint16(8, 0x0800, true);
    dvc.setUint16(10, 0, true);
    dvc.setUint16(12, time, true);
    dvc.setUint16(14, date, true);
    dvc.setUint32(16, crc, true);
    dvc.setUint32(20, size, true);
    dvc.setUint32(24, size, true);
    dvc.setUint16(28, nameBuf.length, true);
    dvc.setUint16(30, 0, true);
    dvc.setUint16(32, 0, true);
    dvc.setUint16(34, 0, true);
    dvc.setUint16(36, 0, true);
    dvc.setUint32(38, 0, true);
    dvc.setUint32(42, offset, true);
    central.push(new Uint8Array(cd), nameBuf);
    offset += 30 + nameBuf.length + size;
  }

  const cdStart = offset;
  let cdSize = 0;
  for (const c of central) { chunks.push(c); cdSize += c.length; }

  const eocd = new ArrayBuffer(22);
  const dve = new DataView(eocd);
  dve.setUint32(0, 0x06054b50, true);
  dve.setUint16(4, 0, true);
  dve.setUint16(6, 0, true);
  dve.setUint16(8, files.length, true);
  dve.setUint16(10, files.length, true);
  dve.setUint32(12, cdSize, true);
  dve.setUint32(16, cdStart, true);
  dve.setUint16(20, 0, true);
  chunks.push(new Uint8Array(eocd));

  return new Blob(chunks, { type: 'application/zip' });
}

// =====================================================================
// UI rendering
// =====================================================================
let activeArea = 'showroom';
let activeFilter = 'all';

function slugify(s) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9]+/g, '_')
    .replace(/_+/g, '_')
    .replace(/^_|_$/g, '')
    .substring(0, 50);
}

function fileNameFor(it) {
  const slide = String(it.slide).padStart(2, '0');
  const code = it.code.replace(/[\/]/g, '-');
  return `Slide_${slide}__${it.areaLabel}__Item_${code}__${slugify(it.title)}.jpg`;
}

function statusOf(id) {
  const rec = state[id];
  if (!rec) return 'pending';
  if (rec.na) return 'na';
  if (rec.blob) return 'done';
  return 'pending';
}

function matchesFilter(id) {
  if (activeFilter === 'all') return true;
  return statusOf(id) === activeFilter;
}

function render() {
  const content = document.getElementById('content');
  content.innerHTML = '';

  const area = AUDIT_DATA.areas.find(a => a.key === activeArea);
  if (!area) return;

  // Area summary
  const all = area.sections.flatMap(s => s.items).map(it => makeId(area.key, it.code));
  const doneCount = all.filter(id => statusOf(id) === 'done').length;
  const naCount = all.filter(id => statusOf(id) === 'na').length;
  const pendCount = all.length - doneCount - naCount;
  const summary = document.createElement('div');
  summary.className = 'area-summary';
  summary.innerHTML = `
    <span>Total: <strong>${all.length}</strong> · ✓ <strong>${doneCount}</strong> · ⏳ <strong>${pendCount}</strong> · N/A <strong>${naCount}</strong></span>
    <span>${area.label}</span>
  `;
  content.appendChild(summary);

  // Sections
  for (const sec of area.sections) {
    const secEl = document.createElement('div');
    secEl.className = 'section';
    const ids = sec.items.map(it => makeId(area.key, it.code));
    const sDone = ids.filter(id => statusOf(id) === 'done').length;
    const visibleItems = sec.items.filter(it => matchesFilter(makeId(area.key, it.code)));
    if (visibleItems.length === 0) continue;

    secEl.innerHTML = `
      <div class="section-header">
        <span class="section-title">${sec.name}</span>
        <div class="section-meta">
          <span>${sDone}/${ids.length}</span>
          <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6,9 12,15 18,9"/></svg>
        </div>
      </div>
      <div class="section-body"></div>
    `;
    const body = secEl.querySelector('.section-body');
    secEl.querySelector('.section-header').addEventListener('click', () => {
      secEl.classList.toggle('collapsed');
    });

    for (const item of visibleItems) {
      body.appendChild(renderItem(area, item));
    }

    content.appendChild(secEl);
  }

  updateGlobalStats();
}

function renderItem(area, item) {
  const id = makeId(area.key, item.code);
  const rec = state[id] || {};
  const status = statusOf(id);

  const card = document.createElement('div');
  card.className = 'item-card ' + (status === 'done' ? 'done' : status === 'na' ? 'na' : '');
  card.dataset.id = id;

  const photoHtml = rec.blob && !rec.na
    ? `<div class="photo-preview-wrap">
         <img class="photo-preview" src="${rec.thumb}" alt="">
         <span class="photo-badge">SLIDE ${item.slide}</span>
       </div>`
    : `<div class="photo-empty">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7h3l2-3h8l2 3h3v13H3z"/><circle cx="12" cy="13" r="4"/></svg>
         <span>${rec.na ? 'Marcado como N/A' : 'Sem foto ainda'}</span>
       </div>`;

  card.innerHTML = `
    <div class="item-head">
      <div class="item-code">${item.code}</div>
      <div class="item-info">
        <div class="item-title">${item.title}</div>
        <div class="item-spec">${item.spec}</div>
        <div class="item-slide-ref">Slide ${item.slide}</div>
      </div>
    </div>
    ${item.instruction ? `<div class="item-instruction">${item.instruction}</div>` : ''}
    <div class="photo-area">
      ${photoHtml}
      <div class="photo-actions">
        <input type="file" accept="image/*" capture="environment" hidden id="file-${id}">
        <button class="btn btn-primary" data-act="capture">${rec.blob ? '🔄 Refazer' : '📷 Tirar foto'}</button>
        ${rec.blob ? `<button class="btn btn-secondary btn-icon" data-act="view" title="Ver em tamanho original">🔍</button>` : ''}
        <button class="btn btn-na ${rec.na ? 'active' : ''}" data-act="na">N/A</button>
      </div>
    </div>
    <div class="note-wrap">
      <div class="note-label">Observação / andamento</div>
      <textarea class="note-input" data-act="note" rows="1" placeholder="Anote o status, andamento ou ${item.instruction ? 'detalhes' : 'descrição'}...">${rec.note || ''}</textarea>
    </div>
  `;

  // Bind events
  const fileInput = card.querySelector(`#file-${CSS.escape(id)}`);
  card.querySelector('[data-act="capture"]').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => handleFileSelect(e, area, item));
  card.querySelector('[data-act="na"]').addEventListener('click', () => toggleNA(area, item));
  const viewBtn = card.querySelector('[data-act="view"]');
  if (viewBtn) viewBtn.addEventListener('click', () => viewFullImage(rec.blob, item));
  const noteInput = card.querySelector('[data-act="note"]');
  let noteTimer;
  noteInput.addEventListener('input', e => {
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => saveNote(area, item, e.target.value), 400);
  });

  return card;
}

async function handleFileSelect(e, area, item) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  showLoading('Otimizando imagem...');
  try {
    const [compressed, thumb] = await Promise.all([
      compressImage(file),
      makeThumb(file)
    ]);
    const id = makeId(area.key, item.code);
    const existing = state[id] || { id, note: '', na: false };
    const rec = {
      ...existing,
      id,
      blob: compressed,
      thumb,
      na: false,
      capturedAt: new Date().toISOString(),
      fileName: fileNameFor({ ...item, areaLabel: area.label })
    };
    state[id] = rec;
    await dbPut(rec);
    hideLoading();
    render();
    toast('Foto salva!', 'success');
    e.target.value = '';
  } catch (err) {
    hideLoading();
    console.error(err);
    toast('Erro ao processar foto: ' + err.message, 'error');
  }
}

async function toggleNA(area, item) {
  const id = makeId(area.key, item.code);
  const existing = state[id] || { id, note: '' };
  const newNA = !existing.na;
  const rec = { ...existing, id, na: newNA };
  if (newNA) {
    // Remove blob when marking as N/A
    delete rec.blob;
    delete rec.thumb;
    delete rec.capturedAt;
  }
  state[id] = rec;
  await dbPut(rec);
  render();
  toast(newNA ? 'Marcado como N/A' : 'Removido N/A', 'success');
}

async function saveNote(area, item, note) {
  const id = makeId(area.key, item.code);
  const existing = state[id] || { id, na: false };
  const rec = { ...existing, id, note };
  state[id] = rec;
  await dbPut(rec);
}

function viewFullImage(blob, item) {
  if (!blob) return;
  const url = URL.createObjectURL(blob);
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div style="max-width: 95vw; max-height: 95vh; display: flex; flex-direction: column; gap: 10px;">
      <div style="color: var(--gold); font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-align: center;">
        Item ${item.code} · Slide ${item.slide}
      </div>
      <img src="${url}" style="max-width: 100%; max-height: 80vh; border-radius: 8px; border: 1px solid var(--gold-dark);">
      <button class="btn btn-secondary" id="close-view">Fechar</button>
    </div>
  `;
  modal.addEventListener('click', e => {
    if (e.target === modal || e.target.id === 'close-view') {
      URL.revokeObjectURL(url);
      modal.remove();
    }
  });
  document.body.appendChild(modal);
}

// =====================================================================
// Global stats & UI helpers
// =====================================================================
function updateGlobalStats() {
  const all = allItems();
  let totalDone = 0, totalNA = 0;
  for (const it of all) {
    const s = statusOf(it.id);
    if (s === 'done') totalDone++;
    else if (s === 'na') totalNA++;
  }
  const total = all.length;
  document.getElementById('done-count').textContent = totalDone;
  document.getElementById('total-count').textContent = total;
  const pct = total > 0 ? ((totalDone + totalNA) / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';

  // Tab counts
  for (const area of AUDIT_DATA.areas) {
    const ids = area.sections.flatMap(s => s.items.map(it => makeId(area.key, it.code)));
    const d = ids.filter(id => statusOf(id) === 'done').length;
    const el = document.getElementById('count-' + area.key);
    if (el) el.textContent = `${d}/${ids.length}`;
  }
}

function showLoading(msg) {
  document.getElementById('loading-text').textContent = msg || 'Processando...';
  document.getElementById('loading-overlay').classList.remove('hidden');
}
function hideLoading() {
  document.getElementById('loading-overlay').classList.add('hidden');
}

let toastTimer;
function toast(msg, kind) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (kind ? ' toast-' + kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2500);
}

// =====================================================================
// Download / Export
// =====================================================================
async function downloadAllZip() {
  const all = allItems().filter(it => state[it.id] && state[it.id].blob);
  if (all.length === 0) {
    toast('Nenhuma foto para baixar ainda', 'error');
    return;
  }

  showLoading(`Montando ZIP com ${all.length} foto(s)...`);

  try {
    const files = [];
    // README
    const lines = [
      `RELATÓRIO DE IMAGENS — AUDIT SHEET`,
      `Concessionária: ${AUDIT_DATA.dealership}`,
      `Dealer Code: ${AUDIT_DATA.dealerCode}`,
      `Endereço: ${AUDIT_DATA.address}`,
      `Gerado em: ${new Date().toLocaleString('pt-BR')}`,
      ``,
      `Fotos contidas: ${all.length}`,
      ``,
      `Cada arquivo segue o padrão: Slide_XX__Area__Item_CODE__Titulo.jpg`,
      `Basta arrastar cada foto para o slide correspondente no .pptx.`,
      ``,
      `------------------------------------------`,
      `LISTA DE FOTOS:`,
      ``
    ];
    for (const it of all) {
      const rec = state[it.id];
      lines.push(`Slide ${String(it.slide).padStart(2,'0')} · ${it.areaLabel} · Item ${it.code} — ${it.title}`);
      if (rec.note) lines.push(`   Nota: ${rec.note.replace(/\n/g,' ')}`);
    }
    lines.push('', '------------------------------------------', 'ITENS PENDENTES OU N/A:', '');
    for (const it of allItems()) {
      const rec = state[it.id];
      const st = statusOf(it.id);
      if (st === 'done') continue;
      const tag = st === 'na' ? 'N/A' : 'PENDENTE';
      lines.push(`[${tag}] Slide ${String(it.slide).padStart(2,'0')} · ${it.areaLabel} · Item ${it.code} — ${it.title}`);
      if (rec && rec.note) lines.push(`   Nota: ${rec.note.replace(/\n/g,' ')}`);
    }
    files.push({ name: '_LEIA-ME.txt', data: new TextEncoder().encode(lines.join('\n')) });

    // Photos organized in subfolders
    for (const it of all) {
      const rec = state[it.id];
      const folder = it.areaLabel === 'Showroom' ? '01_Showroom' : '02_Oficina';
      files.push({
        name: `${folder}/${fileNameFor(it)}`,
        data: rec.blob
      });
    }

    const zipBlob = await buildZip(files);
    const ts = new Date().toISOString().slice(0,10);
    triggerDownload(zipBlob, `Audit_Sheet_Fotos_${ts}.zip`);
    hideLoading();
    toast(`ZIP baixado com ${all.length} foto(s)`, 'success');
  } catch (err) {
    hideLoading();
    console.error(err);
    toast('Erro ao gerar ZIP: ' + err.message, 'error');
  }
}

function triggerDownload(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(url);
    a.remove();
  }, 100);
}

async function exportJSON() {
  const all = await dbGetAll();
  // Convert blobs to base64
  const payload = {
    version: 1,
    dealership: AUDIT_DATA.dealership,
    exportedAt: new Date().toISOString(),
    records: []
  };
  showLoading('Gerando backup...');
  for (const r of all) {
    const entry = { id: r.id, note: r.note || '', na: !!r.na, capturedAt: r.capturedAt || null };
    if (r.blob) {
      entry.blob = await blobToBase64(r.blob);
      entry.fileName = r.fileName || null;
    }
    payload.records.push(entry);
  }
  hideLoading();
  const json = JSON.stringify(payload, null, 2);
  triggerDownload(new Blob([json], { type: 'application/json' }), `Audit_Backup_${new Date().toISOString().slice(0,10)}.json`);
  toast('Backup exportado', 'success');
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const result = r.result;
      const idx = result.indexOf(',');
      resolve(result.slice(idx + 1));
    };
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
}

function base64ToBlob(b64, type = 'image/jpeg') {
  const binary = atob(b64);
  const arr = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
  return new Blob([arr], { type });
}

async function importJSON(file) {
  showLoading('Importando backup...');
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.records || !Array.isArray(data.records)) throw new Error('Formato inválido');
    let count = 0;
    for (const r of data.records) {
      const rec = {
        id: r.id,
        note: r.note || '',
        na: !!r.na,
        capturedAt: r.capturedAt || null
      };
      if (r.blob) {
        rec.blob = base64ToBlob(r.blob);
        rec.thumb = await makeThumb(rec.blob);
        rec.fileName = r.fileName || null;
      }
      state[r.id] = rec;
      await dbPut(rec);
      count++;
    }
    hideLoading();
    render();
    toast(`${count} registro(s) importado(s)`, 'success');
  } catch (err) {
    hideLoading();
    console.error(err);
    toast('Erro ao importar: ' + err.message, 'error');
  }
}

function exportCSV() {
  const rows = [['Area', 'Secao', 'Codigo', 'Item', 'Slide', 'Status', 'Observacao']];
  for (const it of allItems()) {
    const rec = state[it.id];
    const st = statusOf(it.id);
    const stLabel = st === 'done' ? 'Feita' : st === 'na' ? 'N/A' : 'Pendente';
    rows.push([
      it.areaLabel,
      it.section,
      it.code,
      it.title,
      String(it.slide),
      stLabel,
      (rec && rec.note) ? rec.note.replace(/"/g, '""') : ''
    ]);
  }
  const csv = '\uFEFF' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\n');
  triggerDownload(new Blob([csv], { type: 'text/csv;charset=utf-8' }), `Audit_Checklist_${new Date().toISOString().slice(0,10)}.csv`);
  toast('Checklist CSV exportado', 'success');
}

// =====================================================================
// Event wiring
// =====================================================================
function wireUI() {
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      activeArea = t.dataset.area;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  document.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      activeFilter = c.dataset.filter;
      render();
    });
  });

  document.getElementById('download-btn').addEventListener('click', downloadAllZip);

  const menuModal = document.getElementById('menu-modal');
  document.getElementById('menu-btn').addEventListener('click', () => menuModal.classList.remove('hidden'));
  document.getElementById('close-menu-btn').addEventListener('click', () => menuModal.classList.add('hidden'));
  menuModal.addEventListener('click', e => { if (e.target === menuModal) menuModal.classList.add('hidden'); });

  document.getElementById('export-json-btn').addEventListener('click', () => {
    menuModal.classList.add('hidden');
    exportJSON();
  });
  document.getElementById('export-checklist-btn').addEventListener('click', () => {
    menuModal.classList.add('hidden');
    exportCSV();
  });
  const importInput = document.getElementById('import-json-input');
  document.getElementById('import-json-btn').addEventListener('click', () => importInput.click());
  importInput.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (f) {
      menuModal.classList.add('hidden');
      importJSON(f);
      e.target.value = '';
    }
  });
  document.getElementById('clear-btn').addEventListener('click', async () => {
    if (!confirm('Tem certeza? Isso apaga TODAS as fotos e notas salvas no aparelho. Esta ação não pode ser desfeita.')) return;
    showLoading('Limpando dados...');
    await dbClear();
    for (const k of Object.keys(state)) delete state[k];
    hideLoading();
    menuModal.classList.add('hidden');
    render();
    toast('Dados apagados', 'success');
  });
}
